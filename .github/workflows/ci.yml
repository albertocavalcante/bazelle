name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-amd64
          - os: macos-14
            name: darwin-arm64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Bazelisk
        uses: bazel-contrib/setup-bazel@77a1d3d18379c7cb0a7e3b9fcaaa4d94f1029763 # 0.18.0
        with:
          bazelisk-cache: true
          external-cache: true

      - name: Build all targets
        run: bazel build //...

      - name: Run tests
        run: bazel test //...

      # MODULE.bazel.lock pins every registry file by hash, so an offline or
      # mirror-only build can serve them from the repository cache. Keep it
      # current: fail if the build had to change it, and upload the file the
      # build produced so it can be committed.
      - name: Lockfile is up to date
        id: lockfile
        run: git diff --exit-code MODULE.bazel.lock

      - name: Upload the updated lockfile
        if: failure() && steps.lockfile.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MODULE.bazel.lock-${{ matrix.name }}
          path: MODULE.bazel.lock
          retention-days: 7

  buildifier:
    runs-on: ubuntu-24.04
    name: Lint (Buildifier)
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Bazelisk
        uses: bazel-contrib/setup-bazel@77a1d3d18379c7cb0a7e3b9fcaaa4d94f1029763 # 0.18.0
        with:
          bazelisk-cache: true
          external-cache: true

      - name: Check BUILD files formatting
        run: |
          bazel run @buildifier_prebuilt//:buildifier -- -mode=check -lint=warn -r .
        continue-on-error: true

  actionlint:
    runs-on: ubuntu-24.04
    name: Lint (Actions)
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run actionlint
        uses: reviewdog/action-actionlint@f4bb4d50c4c9e45cc64f413d2bc438ea1cf2d9d5 # v1.70.0
        with:
          fail_level: error
          filter_mode: nofilter
          reporter: github-pr-review

  vscode-extension:
    runs-on: ubuntu-24.04
    name: VSCode Extension
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Exact version from the extension's packageManager field.
          bun-version-file: editors/code/package.json

      - name: Install dependencies
        working-directory: editors/code
        run: bun install --frozen-lockfile

      - name: Type check
        working-directory: editors/code
        run: bun run typecheck

      - name: Lint
        working-directory: editors/code
        run: bun run lint

      - name: Format check
        working-directory: editors/code
        run: bun run format:check

      - name: Unit tests
        working-directory: editors/code
        run: bun run test

      - name: Build
        working-directory: editors/code
        run: bun run build:prod

      - name: Package extension
        working-directory: editors/code
        run: bun run package

